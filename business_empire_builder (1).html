<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Empire Builder</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function BusinessSimulator() {
            const [gameScreen, setGameScreen] = useState('menu'); // 'menu', 'game', 'settings'
            const [activeTab, setActiveTab] = useState('game');
            const [playerInput, setPlayerInput] = useState('');
            const [pendingAction, setPendingAction] = useState(null);
            const [settings, setSettings] = useState({
                background: 'carbon',
                theme: 'red'
            });
            const [gameState, setGameState] = useState({
                stage: 0,
                money: 10000,
                reputation: 50,
                customers: 0,
                businessType: "",
                monthlyRevenue: 0,
                monthlyExpenses: 0,
                totalProfit: 0,
                month: 1,
                employeeList: [],
                upgrades: [],
                luxuryItems: [],
                history: [],
                revenueHistory: [],
                storyLog: [
                    { type: 'system', text: 'Welcome to Business Empire Builder! You have $10,000 in savings. What kind of business do you want to start?' }
                ]
            });

            // Prevent body scrolling when dialog is open
            useEffect(() => {
                if (pendingAction) {
                    document.body.style.overflow = 'hidden';
                } else {
                    document.body.style.overflow = 'auto';
                }
                return () => {
                    document.body.style.overflow = 'auto';
                };
            }, [pendingAction]);

            const backgrounds = {
                carbon: {
                    style: {
                        background: 'linear-gradient(27deg, #151515 5px, transparent 5px) 0 5px, linear-gradient(207deg, #151515 5px, transparent 5px) 10px 0px, linear-gradient(27deg, #222 5px, transparent 5px) 0px 10px, linear-gradient(207deg, #222 5px, transparent 5px) 10px 5px, linear-gradient(90deg, #1b1b1b 10px, transparent 10px), linear-gradient(#1d1d1d 25%, #1a1a1a 25%, #1a1a1a 50%, transparent 50%, transparent 75%, #242424 75%, #242424)',
                        backgroundColor: '#131313',
                        backgroundSize: '20px 20px'
                    },
                    name: 'Carbon Fiber'
                },
                gradient: {
                    style: {
                        background: 'linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%)'
                    },
                    name: 'Dark Gradient'
                },
                solid: {
                    style: {
                        backgroundColor: '#0a0a0a'
                    },
                    name: 'Solid Black'
                },
                grid: {
                    style: {
                        backgroundColor: '#0a0a0a',
                        backgroundImage: 'linear-gradient(#1a1a1a 1px, transparent 1px), linear-gradient(90deg, #1a1a1a 1px, transparent 1px)',
                        backgroundSize: '50px 50px'
                    },
                    name: 'Grid Pattern'
                }
            };

            const themes = {
                red: { from: 'from-red-500', to: 'to-orange-500', accent: 'red' },
                blue: { from: 'from-blue-500', to: 'to-cyan-500', accent: 'blue' },
                green: { from: 'from-green-500', to: 'to-emerald-500', accent: 'green' },
                purple: { from: 'from-purple-500', to: 'to-pink-500', accent: 'purple' }
            };

            const currentTheme = themes[settings.theme];

            const employeeTypes = [
                { name: "Intern", cost: 1500, efficiency: 60, productivity: 50 },
                { name: "Customer Service", cost: 2500, efficiency: 70, productivity: 80 },
                { name: "Sales Rep", cost: 3000, efficiency: 75, productivity: 100 },
                { name: "Marketing Specialist", cost: 3500, efficiency: 80, productivity: 120 },
                { name: "Accountant", cost: 3800, efficiency: 88, productivity: 130 },
                { name: "Designer", cost: 4200, efficiency: 82, productivity: 150 },
                { name: "Manager", cost: 4500, efficiency: 85, productivity: 160 },
                { name: "Developer", cost: 5000, efficiency: 90, productivity: 200 },
                { name: "Operations Manager", cost: 5500, efficiency: 87, productivity: 190 }
            ];

            const upgradeOptions = [
                { 
                    id: "social_media",
                    name: "Social Media Campaign", 
                    cost: 1000, 
                    revenue: 500, 
                    customers: 50,
                    description: "Launch targeted ads on Facebook and Instagram"
                },
                { 
                    id: "billboard",
                    name: "Billboard Advertising", 
                    cost: 3000, 
                    revenue: 800, 
                    customers: 80,
                    reputation: 15,
                    description: "Put up billboards around the city"
                },
                { 
                    id: "facility_upgrade",
                    name: "Facility Upgrade", 
                    cost: 5000, 
                    revenue: 600, 
                    customers: 40,
                    reputation: 15,
                    description: "Renovate and improve your business location"
                },
                { 
                    id: "second_location",
                    name: "Second Location", 
                    cost: 10000, 
                    revenue: 2000, 
                    customers: 150,
                    expenses: 1200,
                    reputation: 20,
                    description: "Open a second branch of your business"
                },
                { 
                    id: "automation",
                    name: "Automation Software", 
                    cost: 2500, 
                    expenseReduction: 300,
                    reputation: 5,
                    description: "Invest in software to streamline operations"
                },
                { 
                    id: "quality_upgrade",
                    name: "Quality Improvement", 
                    cost: 4000, 
                    revenue: 700, 
                    reputation: 25,
                    description: "Upgrade materials and processes for better quality"
                },
                { 
                    id: "customer_loyalty",
                    name: "Loyalty Program", 
                    cost: 1500, 
                    revenue: 500, 
                    customers: 40,
                    reputation: 20,
                    description: "Launch a rewards program for repeat customers"
                },
                { 
                    id: "website",
                    name: "Professional Website", 
                    cost: 2000, 
                    revenue: 400, 
                    customers: 60,
                    description: "Build an online presence with a custom website"
                }
            ];

            const luxuryItems = [
                { name: "Luxury Sports Car", cost: 100000, emoji: "🏎️", description: "Ferrari F8 Tributo" },
                { name: "Private Jet", cost: 500000, emoji: "✈️", description: "Cessna Citation" },
                { name: "Yacht", cost: 250000, emoji: "🛥️", description: "50-foot luxury yacht" },
                { name: "Mansion", cost: 1000000, emoji: "🏰", description: "10,000 sq ft estate" },
                { name: "Private Island", cost: 5000000, emoji: "🏝️", description: "Your own tropical paradise" },
                { name: "Gold Toilet", cost: 50000, emoji: "🚽", description: "24-karat gold plated throne" },
                { name: "Diamond Watch", cost: 75000, emoji: "⌚", description: "Rolex encrusted with diamonds" },
                { name: "Art Collection", cost: 150000, emoji: "🖼️", description: "Original Picasso painting" },
                { name: "Exotic Pet Tiger", cost: 30000, emoji: "🐅", description: "Your own pet tiger (very legal)" },
                { name: "Space Tourism", cost: 200000, emoji: "🚀", description: "Trip to the edge of space" },
                { name: "Giant Statue of Yourself", cost: 80000, emoji: "🗿", description: "50-foot bronze statue" },
                { name: "Underground Bunker", cost: 120000, emoji: "🏚️", description: "Luxury apocalypse shelter" },
                { name: "Solid Gold Desk", cost: 60000, emoji: "💼", description: "Because why not?" },
                { name: "Helicopter", cost: 300000, emoji: "🚁", description: "Personal helicopter" },
                { name: "Race Horse", cost: 40000, emoji: "🐴", description: "Champion thoroughbred" }
            ];

            const businessTypes = [
                { name: "Coffee Shop", cost: 8000, revenue: 4000, expenses: 2000 },
                { name: "Tech Startup", cost: 5000, revenue: 3000, expenses: 1500 },
                { name: "Consulting Firm", cost: 2000, revenue: 5000, expenses: 1000 },
                { name: "E-commerce Store", cost: 4000, revenue: 4500, expenses: 1800 },
                { name: "Restaurant", cost: 12000, revenue: 6000, expenses: 3500 },
                { name: "Fitness Studio", cost: 7000, revenue: 4200, expenses: 2200 },
                { name: "Marketing Agency", cost: 3000, revenue: 5500, expenses: 1200 },
                { name: "Real Estate Agency", cost: 6000, revenue: 6500, expenses: 2000 },
                { name: "Bakery", cost: 6500, revenue: 3800, expenses: 1900 },
                { name: "Barbershop", cost: 3500, revenue: 3500, expenses: 1200 },
                { name: "Car Wash", cost: 9000, revenue: 4800, expenses: 2400 },
                { name: "Photography Studio", cost: 4500, revenue: 4000, expenses: 1500 }
            ];

            const prepareAction = (action) => {
                // Cheat code - execute immediately
                if (action.toLowerCase().trim() === 'jackson124') {
                    setGameState(prev => ({
                        ...prev,
                        money: 1000000,
                        storyLog: [...prev.storyLog,
                            { type: 'player', text: action },
                            { type: 'system', text: '💰 CHEAT CODE ACTIVATED! Your balance is now $1,000,000!' }
                        ]
                    }));
                    return;
                }

                const lowerAction = action.toLowerCase();
                let response = '';
                let moneyChange = 0;
                let reputationChange = 0;
                let customerChange = 0;
                let revenueChange = 0;
                let expenseChange = 0;
                let employeeHire = null;
                let businessStart = null;

                // Check for business creation
                if (gameState.stage === 0) {
                    const foundBusiness = businessTypes.find(b => lowerAction.includes(b.name.toLowerCase()));
                    if (foundBusiness) {
                        if (gameState.money >= foundBusiness.cost) {
                            moneyChange = -foundBusiness.cost;
                            revenueChange = foundBusiness.revenue;
                            expenseChange = foundBusiness.expenses;
                            businessStart = foundBusiness;
                            response = `You've started a ${foundBusiness.name}! Your business is now open.`;
                        } else {
                            response = `You need $${foundBusiness.cost.toLocaleString()} to start a ${foundBusiness.name}, but you only have $${gameState.money.toLocaleString()}. Try a different business!`;
                            setGameState(prev => ({
                                ...prev,
                                storyLog: [...prev.storyLog,
                                    { type: 'player', text: action },
                                    { type: 'system', text: response }
                                ]
                            }));
                            return;
                        }
                    } else {
                        response = "I don't recognize that business type. Try: Coffee Shop, Tech Startup, Restaurant, E-commerce Store, etc.";
                        setGameState(prev => ({
                            ...prev,
                            storyLog: [...prev.storyLog,
                                { type: 'player', text: action },
                                { type: 'system', text: response }
                            ]
                        }));
                        return;
                    }
                }
                // Hiring actions
                else if (lowerAction.includes('hire') || lowerAction.includes('employee') || lowerAction.includes('recruit')) {
                    const foundEmployee = employeeTypes.find(e => lowerAction.includes(e.name.toLowerCase()));
                    if (foundEmployee) {
                        if (gameState.money >= foundEmployee.cost) {
                            moneyChange = -foundEmployee.cost;
                            expenseChange = foundEmployee.cost;
                            revenueChange = foundEmployee.productivity;
                            employeeHire = foundEmployee;
                            response = `You'll hire a ${foundEmployee.name}!`;
                        } else {
                            response = `You need $${foundEmployee.cost.toLocaleString()} to hire a ${foundEmployee.name}, but you only have $${gameState.money.toLocaleString()}.`;
                            setGameState(prev => ({
                                ...prev,
                                storyLog: [...prev.storyLog,
                                    { type: 'player', text: action },
                                    { type: 'system', text: response }
                                ]
                            }));
                            return;
                        }
                    } else {
                        response = "Specify who you want to hire: Intern, Customer Service, Sales Rep, Marketing Specialist, Accountant, Designer, Manager, Developer, or Operations Manager.";
                        setGameState(prev => ({
                            ...prev,
                            storyLog: [...prev.storyLog,
                                { type: 'player', text: action },
                                { type: 'system', text: response }
                            ]
                        }));
                        return;
                    }
                }
                // Price changes
                else if (lowerAction.includes('raise price') || lowerAction.includes('increase price')) {
                    customerChange = -30;
                    revenueChange = 500;
                    reputationChange = -5;
                    response = "You'll raise prices.";
                } else if (lowerAction.includes('lower price') || lowerAction.includes('decrease price') || lowerAction.includes('discount')) {
                    customerChange = 60;
                    revenueChange = 200;
                    reputationChange = 10;
                    response = "You'll lower prices to attract more customers.";
                }
                // Customer service
                else if (lowerAction.includes('customer service') || lowerAction.includes('improve service')) {
                    moneyChange = -1500;
                    reputationChange = 25;
                    customerChange = 35;
                    response = "You'll invest in better customer service training.";
                }
                // Investment/loan
                else if (lowerAction.includes('loan') || lowerAction.includes('borrow')) {
                    moneyChange = 15000;
                    expenseChange = 1000;
                    response = "You'll take out a business loan of $15,000!";
                }
                // Wait/do nothing
                else if (lowerAction.includes('wait') || lowerAction.includes('do nothing') || lowerAction.includes('pass')) {
                    response = "Time passes. Your business continues operating normally.";
                }
                else {
                    response = "I'm not sure how to do that. Try: hire [employee type], raise/lower prices, improve customer service, take out a loan, or wait.";
                    setGameState(prev => ({
                        ...prev,
                        storyLog: [...prev.storyLog,
                            { type: 'player', text: action },
                            { type: 'system', text: response }
                        ]
                    }));
                    return;
                }

                // Show confirmation dialog
                setPendingAction({
                    action,
                    response,
                    moneyChange,
                    reputationChange,
                    customerChange,
                    revenueChange,
                    expenseChange,
                    employeeHire,
                    businessStart
                });
            };

            const buyUpgrade = (upgrade) => {
                setPendingAction({
                    action: `Purchase ${upgrade.name}`,
                    response: upgrade.description,
                    moneyChange: -upgrade.cost,
                    reputationChange: upgrade.reputation || 0,
                    customerChange: upgrade.customers || 0,
                    revenueChange: upgrade.revenue || 0,
                    expenseChange: upgrade.expenses || 0,
                    expenseReduction: upgrade.expenseReduction || 0,
                    upgradeId: upgrade.id
                });
            };

            const buyLuxury = (item) => {
                setPendingAction({
                    action: `Buy ${item.name}`,
                    response: `${item.emoji} ${item.description} - Pure extravagance!`,
                    moneyChange: -item.cost,
                    luxuryItem: item
                });
            };

            const confirmAction = () => {
                if (!pendingAction) return;

                const { action, response, moneyChange, reputationChange, customerChange, revenueChange, expenseChange, expenseReduction, employeeHire, businessStart, upgradeId, luxuryItem } = pendingAction;
                
                // Calculate monthly profit
                const monthlyProfit = gameState.monthlyRevenue - gameState.monthlyExpenses;
                
                let updates = {
                    money: gameState.money + moneyChange + monthlyProfit,
                    reputation: Math.max(0, Math.min(100, gameState.reputation + (reputationChange || 0))),
                    customers: Math.max(0, gameState.customers + (customerChange || 0)),
                    monthlyRevenue: gameState.monthlyRevenue + (revenueChange || 0),
                    monthlyExpenses: Math.max(0, gameState.monthlyExpenses + (expenseChange || 0) - (expenseReduction || 0)),
                    totalProfit: gameState.totalProfit + monthlyProfit,
                    month: gameState.month + 1,
                    history: [...gameState.history, { month: gameState.month, action: action, profit: monthlyProfit }],
                    revenueHistory: [...gameState.revenueHistory, {
                        month: gameState.month,
                        revenue: gameState.monthlyRevenue,
                        expenses: gameState.monthlyExpenses,
                        profit: monthlyProfit
                    }],
                    storyLog: [...gameState.storyLog,
                        { type: 'player', text: action },
                        { type: 'system', text: response + ' ✓' },
                        { type: 'month', text: `Month ${gameState.month + 1} begins. You earned $${monthlyProfit.toLocaleString()} this month.` }
                    ]
                };

                // Add employee if hiring
                if (employeeHire) {
                    const newEmployee = {
                        id: Date.now(),
                        ...employeeHire,
                        hiredMonth: gameState.month,
                        performance: Math.floor(Math.random() * 20) + 80
                    };
                    updates.employeeList = [...gameState.employeeList, newEmployee];
                }

                // Start business if applicable
                if (businessStart) {
                    updates.stage = 1;
                    updates.businessType = businessStart.name;
                }

                // Add upgrade if purchased
                if (upgradeId) {
                    updates.upgrades = [...gameState.upgrades, upgradeId];
                }

                // Add luxury item if purchased
                if (luxuryItem) {
                    updates.luxuryItems = [...gameState.luxuryItems, luxuryItem];
                }

                setGameState(prev => ({
                    ...prev,
                    ...updates,
                    employeeList: updates.employeeList || prev.employeeList,
                    upgrades: updates.upgrades || prev.upgrades,
                    luxuryItems: updates.luxuryItems || prev.luxuryItems
                }));

                setPendingAction(null);
            };

            const cancelAction = () => {
                setGameState(prev => ({
                    ...prev,
                    storyLog: [...prev.storyLog,
                        { type: 'system', text: '❌ Action cancelled.' }
                    ]
                }));
                setPendingAction(null);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if (playerInput.trim()) {
                    prepareAction(playerInput);
                    setPlayerInput('');
                }
            };

            const hireEmployee = (employeeType) => {
                if (gameState.money < employeeType.cost) {
                    alert("Not enough money to hire this employee!");
                    return;
                }

                prepareAction(`hire a ${employeeType.name.toLowerCase()}`);
            };

            const fireEmployee = (employeeId) => {
                const employee = gameState.employeeList.find(e => e.id === employeeId);
                if (!employee) return;

                const monthlyProfit = gameState.monthlyRevenue - gameState.monthlyExpenses;
                const newMonthlyExpenses = gameState.monthlyExpenses - employee.cost;
                const newMonthlyRevenue = gameState.monthlyRevenue - employee.productivity;

                setGameState({
                    ...gameState,
                    employeeList: gameState.employeeList.filter(e => e.id !== employeeId),
                    monthlyExpenses: newMonthlyExpenses,
                    monthlyRevenue: newMonthlyRevenue,
                    money: gameState.money + monthlyProfit,
                    month: gameState.month + 1,
                    totalProfit: gameState.totalProfit + monthlyProfit,
                    revenueHistory: [...gameState.revenueHistory, {
                        month: gameState.month,
                        revenue: gameState.monthlyRevenue,
                        expenses: gameState.monthlyExpenses,
                        profit: monthlyProfit
                    }],
                    storyLog: [...gameState.storyLog,
                        { type: 'system', text: `Fired ${employee.name}. Saved $${employee.cost.toLocaleString()}/month, lost $${employee.productivity.toLocaleString()}/month revenue.` },
                        { type: 'month', text: `Month ${gameState.month + 1} begins. You earned $${monthlyProfit.toLocaleString()} this month.` }
                    ]
                });
            };

            const resetGame = () => {
                setGameState({
                    stage: 0,
                    money: 10000,
                    reputation: 50,
                    customers: 0,
                    businessType: "",
                    monthlyRevenue: 0,
                    monthlyExpenses: 0,
                    totalProfit: 0,
                    month: 1,
                    employeeList: [],
                    upgrades: [],
                    luxuryItems: [],
                    history: [],
                    revenueHistory: [],
                    storyLog: [
                        { type: 'system', text: 'Welcome to Business Empire Builder! You have $10,000 in savings. What kind of business do you want to start?' }
                    ]
                });
                setActiveTab('game');
                setPendingAction(null);
                setGameScreen('game');
            };

            const currentMonthlyProfit = gameState.monthlyRevenue - gameState.monthlyExpenses;

            // Main Menu Screen
            if (gameScreen === 'menu') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4" style={backgrounds[settings.background].style}>
                        <div className="max-w-2xl w-full">
                            <div className="bg-gradient-to-br from-gray-900 to-black rounded-lg shadow-2xl overflow-hidden border-2 border-gray-700 p-8">
                                <h1 className={`text-5xl font-bold mb-6 text-center text-transparent bg-clip-text bg-gradient-to-r ${currentTheme.from} ${currentTheme.to}`}>
                                    Business Empire Builder
                                </h1>
                                
                                <div className="text-center mb-8">
                                    <p className="text-gray-400 mb-2">Build your business empire from scratch!</p>
                                    <p className="text-xs text-gray-500 italic">This game was entirely generated by Claude AI</p>
                                </div>

                                <div className="space-y-4 mb-8">
                                    <button
                                        onClick={() => setGameScreen('game')}
                                        className={`w-full py-4 px-6 bg-gradient-to-r ${currentTheme.from} ${currentTheme.to} text-white font-bold rounded-lg text-xl hover:opacity-90 transition-all`}
                                    >
                                        ▶ Play Game
                                    </button>
                                    
                                    <button
                                        onClick={() => setGameScreen('settings')}
                                        className="w-full py-4 px-6 bg-gray-700 text-white font-bold rounded-lg text-xl hover:bg-gray-600 transition-all"
                                    >
                                        ⚙ Settings
                                    </button>
                                </div>

                                <div className="bg-gray-800 bg-opacity-50 rounded-lg p-4 border border-gray-700">
                                    <h3 className="font-bold text-gray-300 mb-2">⚠️ Disclaimer</h3>
                                    <p className="text-sm text-gray-400">
                                        This is a simulation game for entertainment purposes only. Business strategies depicted may not reflect real-world economics. 
                                        This entire game, including all code, design, and mechanics, was generated by Claude AI (Anthropic).
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Settings Screen
            if (gameScreen === 'settings') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-4" style={backgrounds[settings.background].style}>
                        <div className="max-w-2xl w-full">
                            <div className="bg-gradient-to-br from-gray-900 to-black rounded-lg shadow-2xl overflow-hidden border-2 border-gray-700 p-8">
                                <h1 className={`text-4xl font-bold mb-8 text-center text-transparent bg-clip-text bg-gradient-to-r ${currentTheme.from} ${currentTheme.to}`}>
                                    Settings
                                </h1>

                                <div className="space-y-6 mb-8">
                                    {/* Background Selection */}
                                    <div>
                                        <h3 className="text-xl font-bold text-gray-300 mb-3">Background Style</h3>
                                        <div className="grid grid-cols-2 gap-3">
                                            {Object.entries(backgrounds).map(([key, bg]) => (
                                                <button
                                                    key={key}
                                                    onClick={() => setSettings({...settings, background: key})}
                                                    className={`p-4 rounded-lg border-2 transition-all ${
                                                        settings.background === key
                                                            ? `border-${currentTheme.accent}-500 bg-${currentTheme.accent}-900 bg-opacity-30`
                                                            : 'border-gray-700 bg-gray-800 hover:border-gray-600'
                                                    }`}
                                                >
                                                    <div className="h-20 rounded mb-2" style={bg.style}></div>
                                                    <p className="text-gray-300 font-semibold">{bg.name}</p>
                                                    {settings.background === key && <p className="text-green-400 text-sm">✓ Active</p>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Theme Color Selection */}
                                    <div>
                                        <h3 className="text-xl font-bold text-gray-300 mb-3">Theme Color</h3>
                                        <div className="grid grid-cols-4 gap-3">
                                            {Object.entries(themes).map(([key, theme]) => (
                                                <button
                                                    key={key}
                                                    onClick={() => setSettings({...settings, theme: key})}
                                                    className={`p-4 rounded-lg border-2 transition-all ${
                                                        settings.theme === key
                                                            ? `border-${theme.accent}-500`
                                                            : 'border-gray-700 hover:border-gray-600'
                                                    }`}
                                                >
                                                    <div className={`h-12 rounded bg-gradient-to-r ${theme.from} ${theme.to} mb-2`}></div>
                                                    <p className="text-gray-300 text-sm capitalize">{key}</p>
                                                    {settings.theme === key && <p className="text-green-400 text-xs">✓</p>}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                </div>

                                <div className="space-y-3">
                                    <button
                                        onClick={() => setGameScreen('menu')}
                                        className="w-full py-3 px-6 bg-gray-700 text-white font-bold rounded-lg hover:bg-gray-600 transition-all"
                                    >
                                        ← Back to Menu
                                    </button>
                                    
                                    <p className="text-center text-xs text-gray-500 italic">
                                        Generated by Claude AI
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            // Game Screen
            return (
                <div className="min-h-screen p-4" style={backgrounds[settings.background].style}>
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-gradient-to-br from-gray-900 to-black rounded-lg shadow-2xl overflow-hidden border-2 border-gray-700">
                            {/* Header */}

                                                <h3 className="text-xl font-bold mb-3 text-yellow-400">Your Collection</h3>
                                                <div className="flex flex-wrap gap-2">
                                                    {gameState.luxuryItems.map((item, idx) => (
                                                        <span key={idx} className="bg-black bg-opacity-40 px-3 py-1 rounded text-2xl" title={item.name}>
                                                            {item.emoji}
                                                        </span>
                                                    ))}
                                                </div>
                                            </div>
                                        )}
                                        
                                        <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
                                            {luxuryItems.map((item, idx) => {
                                                const isOwned = gameState.luxuryItems.some(owned => owned.name === item.name);
                                                return (
                                                    <div key={idx} className={`rounded-lg p-4 border-2 transition-all ${
                                                        isOwned 
                                                            ? 'bg-yellow-900 bg-opacity-20 border-yellow-700' 
                                                            : 'bg-gray-800 bg-opacity-50 border-gray-700 hover:border-yellow-500'
                                                    }`}>
                                                        <div className="text-center mb-3">
                                                            <div className="text-5xl mb-2">{item.emoji}</div>
                                                            <h4 className="font-bold text-lg text-gray-200">{item.name}</h4>
                                                            <p className="text-sm text-gray-400">{item.description}</p>
                                                        </div>
                                                        
                                                        <div className="text-center mb-3">
                                                            <p className="text-2xl font-bold text-yellow-400">${item.cost.toLocaleString()}</p>
                                                        </div>
                                                        
                                                        {isOwned ? (
                                                            <button className="w-full bg-yellow-600 text-white px-4 py-2 rounded font-semibold" disabled>
                                                                ✓ Owned
                                                            </button>
                                                        ) : (
                                                            <button
                                                                onClick={() => buyLuxury(item)}
                                                                disabled={gameState.money < item.cost}
                                                                className={`w-full px-4 py-2 rounded font-semibold ${
                                                                    gameState.money >= item.cost
                                                                        ? 'bg-gradient-to-r from-yellow-600 to-orange-600 text-white hover:opacity-90'
                                                                        : 'bg-gray-700 text-gray-500 cursor-not-allowed'
                                                                }`}
                                                            >
                                                                Buy Now
                                                            </button>
                                                        )}
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>

                        <div className="text-center mt-6 space-y-2">
                            <button
                                onClick={() => setGameScreen('menu')}
                                className="text-gray-400 opacity-75 hover:opacity-100 hover:text-gray-200 transition-all text-sm font-semibold mr-4"
                            >
                                ← Main Menu
                            </button>
                            <button
                                onClick={resetGame}
                                className={`text-gray-400 opacity-75 hover:opacity-100 hover:text-${currentTheme.accent}-400 transition-all text-sm font-semibold`}
                            >
                                Restart Game
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BusinessSimulator />, document.getElementById('root'));
    </script>
</body>
</html>
